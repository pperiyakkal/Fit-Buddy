<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "FitBuddy" }}</title>
  <meta name="description" content="FitBuddy AI fitness plan generator">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">FitBuddy<span>AI</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/view-all-users">Users</a>
      <a href="/docs">API Docs</a>
    </nav>
  </header>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>FitBuddy provides general fitness and wellness information, not medical advice.</p>
  </footer>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
